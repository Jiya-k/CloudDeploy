name: CloudDeploy CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -name: Download code
       uses: actions/checkout@v4
       -name: Set up Python
        uses: actions/setup-python@v5
         with:
           python-version: '3.13'
        -name: Install pytest
          run: python -m pip install pytest
        -name: Run tests
          run: python -m pytest